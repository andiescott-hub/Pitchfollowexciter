<title>Multiband Pitch-follow Exciter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* LAYOUT: one-screen plugin window. Slim top bar, a large frequency display that owns the screen,
   a floating band panel docked low in the display, and a transport strip underneath. Single dark look by choice. */
:root{
  color-scheme:dark;
  --bg:#0c0f16; --panel:#151a25; --raise:#1e2533; --line:#2a3345;
  --ink:#e9edf5; --mute:#8d98ad; --hi:#f4efe4;
  --b1:#f5a742; --b2:#f0648c; --b3:#38cfc0; --b4:#9a8cff;
  --ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --num:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.4 var(--ui);display:flex;flex-direction:column;gap:10px;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select,.btn{font:600 13px var(--ui);color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:8px;min-height:36px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover,select:hover{border-color:#3b4760}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,.btn:focus-within,select:focus-visible,input:focus-visible,canvas:focus-visible,.kd:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
h1{font:700 17px/1.2 var(--ui);margin:0 6px 0 0;letter-spacing:.01em}
h1 small{font:500 12px var(--num);color:var(--mute);margin-left:6px}
#status{color:var(--mute);font-size:13px;flex:1 1 160px;text-align:right}
.stage{position:relative;flex:1 1 auto;min-height:320px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:linear-gradient(#111622,#0a0d14)}
.scope{position:relative;flex:1 1 auto;min-height:250px}
#view{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;outline-offset:-3px}
.panel{--c:var(--hi);position:absolute;left:50%;bottom:34px;transform:translateX(-50%);display:flex;align-items:center;gap:6px 16px;
  background:rgba(21,26,37,.93);border:1px solid color-mix(in srgb,var(--c) 50%,var(--line));border-radius:14px;padding:10px 14px;box-shadow:0 12px 30px -12px #000}
.pinfo{display:flex;flex-direction:column;gap:6px;width:112px}
.pname{display:flex;align-items:center;gap:7px;font-weight:700}
.pname i{width:10px;height:10px;border-radius:50%;background:var(--c)}
#pnote{font:500 12px var(--num);color:var(--mute);white-space:nowrap}
.pbtn{display:flex;gap:5px}
#type{min-height:28px;padding:0 6px;font-size:12px;width:100%}
.pbtn button{min-height:28px;width:32px;padding:0;justify-content:center;border-radius:7px;font:700 12px var(--ui)}
.pbtn button[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#10131a}
.knobs{display:flex;gap:10px}
.knob{display:flex;flex-direction:column;align-items:center;width:76px;gap:1px}
.kd{width:52px;height:52px;border-radius:50%;cursor:ns-resize;touch-action:none}
.kd svg{display:block;width:100%;height:100%;overflow:visible}
.kd path{fill:none;stroke-width:3.5;stroke-linecap:round}
.kt{stroke:var(--line)} .kv{stroke:var(--c)}
.kc{fill:var(--raise);stroke:var(--line)} .kp{stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.knob output{font:500 12px var(--num);white-space:nowrap}
.knob span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
#play{background:var(--hi);border-color:var(--hi);color:#10131a;min-width:72px;justify-content:center}
#seek{flex:1 1 160px;accent-color:var(--hi);height:28px}
#time{font:500 12px var(--num);color:var(--mute);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0}
.seg button[aria-pressed=true],#link[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lab{display:inline-flex;align-items:center;gap:6px;color:var(--mute);font-size:12px}
#hint{margin:0;color:var(--mute);font-size:12.5px}
@media(max-width:680px){
  .panel{position:static;transform:none;border-radius:0;border-width:1px 0 0;box-shadow:none;flex-wrap:wrap;justify-content:center}
  .pinfo{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;width:100%}
  #type{width:auto;flex:1 1 100%}
  #status{text-align:left;flex-basis:100%}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <h1>Pitch-follow Exciter<small>multiband prototype</small></h1>
  <label class="btn">Load audio<input type="file" id="file" accept="audio/*" hidden></label>
  <button id="demo">Demo clip</button>
  <span id="status" role="status">Building demo clip…</span>
</header>

<div class="stage">
  <div class="scope"><canvas id="view" tabindex="0" aria-label="Frequency display. Double-click to add a band. Arrow keys move the selected band, Delete removes it."></canvas></div>
  <div class="panel" id="panel" hidden>
    <div class="pinfo">
      <div><div class="pname"><i></i><span id="pname">Band 1</span></div><div id="pnote">&nbsp;</div></div>
      <div class="pbtn">
        <button id="solo" aria-pressed="false" aria-label="Solo this band" title="Solo: hear only what this band adds">S</button>
        <button id="byp" aria-pressed="false" aria-label="Bypass this band" title="Bypass this band">⏻</button>
        <button id="del" aria-label="Remove this band" title="Remove this band">✕</button>
      </div>
      <select id="type" aria-label="Saturation type"><option value="tube">Tube</option><option value="tape">Tape</option><option value="transistor">Transistor</option></select>
    </div>
    <div class="knobs" id="knobs"></div>
  </div>
</div>

<div class="bar">
  <button id="play" disabled>Play</button>
  <input type="range" id="seek" min="0" max="1" step="0.01" value="0" aria-label="Position">
  <span id="time">0:00 / 0:00</span>
  <div class="seg" role="group" aria-label="Listen to">
    <button data-l="mix" aria-pressed="true">Mix</button><button data-l="added" aria-pressed="false" title="Only what the exciter adds">Added</button><button data-l="dry" aria-pressed="false" title="Original, exciter off">Dry</button>
  </div>
  <label class="lab" for="key">Key<select id="key"><option value="off">Off</option><option value="auto">Auto-detect</option></select></label>
  <button id="link" aria-pressed="false" title="Upper bands prefer harmonics of the lowest band's note">Bass link</button>
</div>
<p id="hint">Double-click the display to add a band (up to four). Drag a band to move it, drag its dot up or down for Amount, scroll over it for Focus. Band edges snap together when they meet (hold Alt to place freely).</p>

<script>
(()=>{
const $=id=>document.getElementById(id),TAU=Math.PI*2;
const FLO=20,FHI=20000,MAXB=4,MAX_SEC=120,SN=8192,AMIN=-24,AMAX=18;
const COL=['#f5a742','#f0648c','#38cfc0','#9a8cff'];
const NOTE=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
// Multi-resolution analysis: long windows for lows, short for highs.
const RES=[{N:8192,hop:1024,lo:18,hi:270},{N:4096,hop:512,lo:55,hi:1150},{N:2048,hop:256,lo:330,hi:4600},{N:1024,hop:256,lo:1300,hi:12500}];
// Automatic per-band settings from centre frequency (interpolated in log frequency).
const WIN=[[80,7],[250,4],[1000,2.5],[3000,1.5]],GLD=[[80,60],[250,40],[1000,25],[3000,15]],QS=[[40,6],[250,17]];
const KK={major:[6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88],minor:[6.33,2.68,3.52,5.38,2.60,3.53,2.54,4.75,3.98,2.69,3.34,3.17]};
const SCALE={major:[0,2,4,5,7,9,11],minor:[0,2,3,5,7,8,10]};
const S={sr:44100,n:0,mono:null,dry:null,gmax:1e-9,ready:false,name:'',keyAuto:null,keyMask:null,link:false};
let bands=[],sel=null,ac=null,dryG=null,master=null,srcDry=null,playing=false,t0=0,off0=0,listen='mix',busy=false,dirty=true;

const status=t=>{$('status').textContent=t};
const tick=()=>new Promise(r=>setTimeout(r,0));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const midiOf=f=>69+12*Math.log2(f/440);
const nameOf=f=>{const m=Math.round(midiOf(f));return NOTE[(m%12+12)%12]+(Math.floor(m/12)-1)};
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const dur=()=>S.n/S.sr||0;
const interp=(p,f)=>{if(f<=p[0][0])return p[0][1];for(let i=1;i<p.length;i++)if(f<=p[i][0]){const a=p[i-1],b=p[i];return a[1]+(b[1]-a[1])*Math.log(f/a[0])/Math.log(b[0]/a[0])}return p[p.length-1][1]};
const fsc=focus=>2**((focus-.5)*1.4);
// Glide knob: far left = fixed (no following, the band sits at its centre), 0.5 = automatic, far right = 3 s.
const isFixed=g=>g<.02;
const glideMs=(fc,g)=>{const a=interp(GLD,fc);return g<=.5?a*2**((g-.5)*4):a*(3000/a)**((g-.5)*2)};
const winOf=b=>interp(WIN,b.fc)*fsc(b.focus);
const edges=b=>{const w=winOf(b);return[b.fc*2**(-w/12),b.fc*2**(w/12)]};
const resFor=f=>f<120?0:f<500?1:f<2000?2:3;

/* ---------- FFT ---------- */
const ffts={},wins={};
function getFFT(n){
  if(ffts[n])return ffts[n];
  const lv=Math.log2(n)|0,rev=new Uint32Array(n),co=new Float64Array(n/2),si=new Float64Array(n/2);
  for(let i=0;i<n;i++){let r=0,x=i;for(let j=0;j<lv;j++){r=(r<<1)|(x&1);x>>=1}rev[i]=r}
  for(let i=0;i<n/2;i++){co[i]=Math.cos(TAU*i/n);si[i]=Math.sin(TAU*i/n)}
  return ffts[n]=(re,im)=>{
    for(let i=0;i<n;i++){const j=rev[i];if(j>i){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}
    for(let sz=2;sz<=n;sz<<=1){const h=sz>>1,st=n/sz;
      for(let i=0;i<n;i+=sz)for(let j=0,k=0;j<h;j++,k+=st){const a=i+j,b=a+h;
        const tr=re[b]*co[k]+im[b]*si[k],ti=im[b]*co[k]-re[b]*si[k];
        re[b]=re[a]-tr;im[b]=im[a]-ti;re[a]+=tr;im[a]+=ti}}
  };
}
function hann(n){if(wins[n])return wins[n];const w=new Float64Array(n);for(let i=0;i<n;i++)w[i]=.5-.5*Math.cos(TAU*i/n);return wins[n]=w}

/* ---------- Analysis (shared by all bands) ---------- */
async function analyse(){
  const m=S.mono,n=S.n;let gmax=1e-9,done=0,last=performance.now();
  const total=RES.reduce((a,r)=>a+Math.max(1,Math.floor((n-r.N)/r.hop)+1)*r.N,0);
  for(const r of RES){
    const N=r.N,fft=getFFT(N),w=hann(N),bin=S.sr/N,sc=4/N;
    r.b0=Math.max(1,Math.floor(r.lo/bin));r.nb=Math.min(N/2-1,Math.ceil(r.hi/bin))-r.b0+1;
    r.nF=Math.max(1,Math.floor((n-N)/r.hop)+1);r.mags=new Float32Array(r.nF*r.nb);
    const re=new Float64Array(N),im=new Float64Array(N);
    for(let f=0;f<r.nF;f++){
      const o=f*r.hop;
      for(let i=0;i<N;i++){const k=o+i;re[i]=(k<n?m[k]:0)*w[i];im[i]=0}
      fft(re,im);
      const base=f*r.nb;
      for(let b=0;b<r.nb;b++){const q=b+r.b0,v=Math.sqrt(re[q]*re[q]+im[q]*im[q])*sc;r.mags[base+b]=v;if(v>gmax)gmax=v}
      done+=N;
      if(performance.now()-last>40){status(`Analysing… ${Math.round(100*done/total)}%`);await tick();last=performance.now()}
    }
  }
  S.gmax=gmax;
}
function detectKey(){
  const r=RES[1],bin=S.sr/r.N,ch=new Float64Array(12),pc=new Uint8Array(r.nb);
  for(let b=0;b<r.nb;b++)pc[b]=((Math.round(midiOf((b+r.b0)*bin))%12)+12)%12;
  for(let f=0;f<r.nF;f+=4){const base=f*r.nb;for(let b=0;b<r.nb;b++)ch[pc[b]]+=r.mags[base+b]}
  let best=null,bs=-2;
  for(const mode in KK)for(let k=0;k<12;k++){
    const p=KK[mode];let sx=0,sy=0,sxx=0,syy=0,sxy=0;
    for(let i=0;i<12;i++){const x=ch[(i+k)%12],y=p[i];sx+=x;sy+=y;sxx+=x*x;syy+=y*y;sxy+=x*y}
    const c=(12*sxy-sx*sy)/Math.sqrt((12*sxx-sx*sx)*(12*syy-sy*sy)||1);
    if(c>bs){bs=c;best={root:k,mode}}
  }
  S.keyAuto=best;
  $('key').options[1].textContent=`Auto (${NOTE[best.root]} ${best.mode})`;
}
function setKeyMask(){
  const v=$('key').value;let k=null;
  if(v==='auto')k=S.keyAuto;else if(v!=='off'){const[r,m]=v.split('-');k={root:+r,mode:m}}
  if(!k){S.keyMask=null;return}
  const mk=new Uint8Array(12);SCALE[k.mode].forEach(d=>mk[(k.root+d)%12]=1);S.keyMask=mk;
}

/* ---------- Tracking ---------- */
function trackBand(b,bass){
  const r=RES[b.res=resFor(b.fc)],sc=fsc(b.focus),hyst=3/sc,[lo,hi]=edges(b),bin=S.sr/r.N,M=r.mags,key=S.keyMask;
  const B0=Math.max(r.b0+1,Math.floor(lo/bin)),B1=Math.min(r.b0+r.nb-2,Math.ceil(hi/bin)),nF=r.nF;
  const freq=new Float32Array(nF),amp=new Float32Array(nF),on=new Uint8Array(nF),bt=bass&&bass.track,br=bt&&RES[bass.res];
  let prev=0,mx=0;
  for(let f=0;f<nF;f++){
    const base=f*r.nb-r.b0;let best=-1,bs=-1e9,near=-1,nd=1e9,ns=0,fb=0;
    if(bt){const j=clamp(Math.round((f*r.hop+r.N/2-br.N/2)/br.hop),0,bt.freq.length-1);if(bt.on[j])fb=bt.freq[j]}
    for(let q=B0;q<=B1;q++){
      const v=M[base+q];
      if(v>M[base+q-1]&&v>=M[base+q+1]){
        const fq=q*bin;let s=20*Math.log10(v+1e-12);
        if(key&&key[((Math.round(midiOf(fq))%12)+12)%12])s+=6;               // prefer notes in the key
        if(fb>0){const h=Math.round(fq/fb);if(h>=1&&Math.abs(1200*Math.log2(fq/(h*fb)))<45)s+=6} // prefer harmonics of the bass note
        if(s>bs){bs=s;best=q}
        if(prev>0){const dd=Math.abs(Math.log2(fq/prev));if(dd<nd){nd=dd;near=q;ns=s}}
      }
    }
    if(best<0){freq[f]=prev||b.fc;continue}
    let k=best;if(near>=0&&near!==best&&nd<0.125&&bs-ns<hyst)k=near;           // hysteresis: stay on the current note
    const a=Math.log(M[base+k-1]+1e-12),c0=Math.log(M[base+k]+1e-12),c=Math.log(M[base+k+1]+1e-12),den=a-2*c0+c;
    const p=clamp(den!==0?.5*(a-c)/den:0,-.5,.5),mp=Math.exp(c0-.25*(a-c)*p);
    prev=freq[f]=(k+p)*bin;amp[f]=mp;if(mp>mx)mx=mp;
  }
  const thr=Math.max(mx*0.0126,S.gmax*1e-4);                                    // automatic gate: 38 dB under the band's own peak
  for(let f=0;f<nF;f++)on[f]=amp[f]>thr?1:0;
  b.track={freq,amp,on,mask:on,nF};
}
// Rule: no shared partials. If two bands land within a semitone, the weaker one yields for that moment.
function computeMasks(){
  bands.forEach((a,ai)=>{
    const t=a.track,ra=RES[a.res],mask=Uint8Array.from(t.on);
    bands.forEach((c,ci)=>{
      if(c===a||!c.track)return;const u=c.track,rc=RES[c.res];
      for(let f=0;f<t.nF;f++){
        if(!mask[f])continue;
        const j=clamp(Math.round((f*ra.hop+ra.N/2-rc.N/2)/rc.hop),0,u.nF-1);
        if(u.on[j]&&Math.abs(Math.log2(t.freq[f]/u.freq[j]))<1/12&&(t.amp[f]<u.amp[j]||(t.amp[f]===u.amp[j]&&ai>ci)))mask[f]=0;
      }
    });
    t.mask=mask;
    let s=0;for(let f=0;f<t.nF;f++)s=(s*31+(mask[f]?Math.round(t.freq[f]*8):0))|0;
    a.newSig=s+'|'+a.fc.toFixed(1)+'|'+a.focus.toFixed(3)+'|'+a.glide.toFixed(3);
  });
}

/* ---------- Per-band render: tracked bandpass gives a phase-locked copy of the note ---------- */
function renderBand(b){
  const t=b.track,r=RES[b.res],n=S.n,sr=S.sr,m=S.mono,out=new Float32Array(n);
  const fixed=isFixed(b.glide),gl=fixed?.01:glideMs(b.fc,b.glide),Q=interp(QS,b.fc),gc=1-Math.exp(-1/(gl*.001*sr));
  const att=1-Math.exp(-1/(.004*sr)),rel=1-Math.exp(-1/(.05*sr)),half=r.N/2,hop=r.hop,last=t.nF-1,mk=t.mask;
  const lf=new Float32Array(t.nF);for(let f=0;f<t.nF;f++)lf[f]=Math.log(fixed?b.fc:t.freq[f]);
  const ev=new Float32Array(n);let cur=lf[0],g=0,x1=0,x2=0,y1=0,y2=0,l1=0,l2=0,cb=0,cl=0,c1=0,c2=0,pk=0;
  for(let i=0;i<n;i++){
    let ft=(i-half)/hop,fi=Math.floor(ft),fr=ft-fi;
    if(fi<0){fi=0;fr=0}else if(fi>=last){fi=last;fr=0}
    const j=fi<last?fi+1:fi;
    cur+=(lf[fi]+(lf[j]-lf[fi])*fr-cur)*gc;
    const tg=mk[fi]+(mk[j]-mk[fi])*fr;g+=(tg-g)*(tg>g?att:rel);
    if((i&31)===0){const w=TAU*Math.exp(cur)/sr,al=Math.sin(w)/(2*Q),a0=1+al;cb=al/a0;cl=(1-Math.cos(w))/(2*a0*Q);c1=-2*Math.cos(w)/a0;c2=(1-al)/a0}
    const x=m[i],y=cb*(x-x2)-c1*y1-c2*y2,lq=cl*(x+2*x1+x2)-c1*l1-c2*l2;x2=x1;x1=x;y2=y1;y1=y;l2=l1;l1=lq;
    // lq is the same note shifted a quarter cycle. 2*s*q is then a pure octave above the note with no
    // envelope-rate (low frequency) term, which a biased saturator would produce.
    const qg=lq*g;ev[i]=2*y*g*qg/Math.sqrt(y*g*y*g+qg*qg+1e-18);
    const s=y*g;out[i]=s;const a=s<0?-s:s;if(a>pk)pk=a;
  }
  if(pk>1e-9){const k=1/pk;for(let i=0;i<n;i++){out[i]*=k;ev[i]*=k}}else pk=0;
  b.data=out;b.ev=ev;b.pk=pk;b.sig=b.newSig;
  b.buf2=new AudioBuffer({length:n,numberOfChannels:1,sampleRate:sr});b.buf2.copyToChannel(ev,0);
  b.buf=new AudioBuffer({length:n,numberOfChannels:1,sampleRate:sr});b.buf.copyToChannel(out,0);
}

/* ---------- Saturation types. Drive 0 is a clean tracked boost for all of them. ----------
   Tube: soft and biased, so even harmonics (octave) lead. Tape: soft and symmetric, gentle odd harmonics.
   Transistor: flat until it clips hard, strong odd harmonics. */
const TYPES={
  tube:{g:Math.tanh,ev:.7,k:7},
  tape:{g:u=>u/Math.sqrt(1+u*u),ev:.08,k:6},
  transistor:{g:u=>u/Math.pow(1+u*u*u*u,.25),ev:0,k:12}
};
// Every curve is symmetric (odd harmonics only). Even harmonics come from the separate octave signal, scaled by ev.
function charParams(c,type){const t=TYPES[type],d=.02+t.k*c**1.5;return{d,g:t.g,den:t.g(d),ev:t.ev*c}}
const sat=(x,p)=>p.g(p.d*x)/p.den;
function setCharacter(b,c){
  b.character=c;const p=b.cp=charParams(c,b.type);
  const cur=new Float32Array(4097);for(let i=0;i<4097;i++){const x=i/2048-1;cur[i]=sat(x,p)-x}b.curve=cur;   // only what the saturator adds; the clean copy bypasses it
  if(b.nodes){b.nodes.sh.curve=cur;b.nodes.ge.gain.value=p.ev}
  // harmonic profile for the display: level of harmonics 2..8 relative to the fundamental
  const K=256,h=[];let m1=1;

$('play').onclick=()=>{ensureCtx();ac.resume();if(playing)stop();else{if(off0>=dur()-.05)off0=0;start(off0)}};
$('seek').oninput=e=>{off0=+e.target.value;$('time').textContent=fmt(off0)+' / '+fmt(dur());if(playing)start(off0);else dirty=true};
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{listen=b.dataset.l;
  document.querySelectorAll('.seg button').forEach(o=>o.setAttribute('aria-pressed',o===b));updateGains()});
['major','minor'].forEach(m=>{const g=document.createElement('optgroup');g.label=m[0].toUpperCase()+m.slice(1);
  NOTE.forEach((n,i)=>g.insertAdjacentHTML('beforeend',`<option value="${i}-${m}">${n} ${m}</option>`));$('key').appendChild(g)});
$('key').onchange=()=>{setKeyMask();request(null)};
$('link').onclick=()=>{S.link=!S.link;$('link').setAttribute('aria-pressed',S.link);request(null)};

/* ---------- Loading ---------- */
async function useAudio(L,R,sr,name,long){
  if(playing)stop();off0=0;S.ready=false;dirty=true;
  const n=L.length,mono=new Float32Array(n);for(let i=0;i<n;i++)mono[i]=.5*(L[i]+R[i]);
  const dry=new AudioBuffer({length:n,numberOfChannels:2,sampleRate:sr});dry.copyToChannel(L,0);dry.copyToChannel(R,1);
  Object.assign(S,{sr,n,mono,dry,name:name+(long?' (first 2 minutes)':'')});
  bands.forEach(b=>{b.track=null;b.sig=null;b.data=null;b.ev=null;b.buf=b.buf2=null;b.df=0});
  await analyse();detectKey();setKeyMask();
  S.ready=true;$('seek').max=dur();$('seek').value=0;$('time').textContent='0:00 / '+fmt(dur());$('play').disabled=false;
  request(null);
}
function makeDemo(sr){
  const beat=.6,len=beat*32,n=Math.floor((len+1)*sr),o=new Float32Array(n),mf=m=>440*2**((m-69)/12);
  const note=(t,l,f,h,amp,att,rel,dec,vib)=>{const s0=Math.floor(t*sr),L=Math.floor((l+rel)*sr);let ph=0;
    for(let i=0;i<L&&s0+i<n;i++){const u=i/sr;let e=u<att?u/att:1;if(u>l)e*=Math.max(0,1-(u-l)/rel);if(dec)e*=Math.exp(-u*dec);
      const vf=vib?1+vib*Math.sin(TAU*5.2*u)*Math.min(1,u/.3):1;ph+=TAU*f*vf/sr;
      let s=0;for(let k=0;k<h.length;k++)if((k+1)*f<sr*.45)s+=h[k]*Math.sin((k+1)*ph);o[s0+i]+=s*e*amp}};
  const roots=[33,29,36,31],pads=[[57,60,64],[53,57,60],[55,60,64],[55,59,62]],pat=[0,0,12,0,0,7,12,7];
  const saw=Array.from({length:12},(_,k)=>1/(k+1));
  roots.forEach((r,c)=>{const t0=c*8*beat;
    pads[c].forEach(m=>note(t0,8*beat-.2,mf(m),[1,.4,.2,.1,.05],.06,.6,.6,0,0));
    for(let e=0;e<16;e++)note(t0+e*beat/2,beat/2-.04,mf(r+pat[e%8]),saw,.22,.004,.03,3,0)});
  const mel=[[69,1],[72,1],[76,1],[74,1],[72,1.5],[69,.5],[67,2],[65,1],[69,1],[72,2],[69,1],[67,1],[65,2],[67,1],[72,1],[76,2],[74,1],[72,1],[67,2],[71,1],[74,1],[79,1],[77,1],[74,2],[71,2]];
  let t=0;mel.forEach(([m,b])=>{note(t,b*beat-.05,mf(m),[1,.5,.3,.15],.11,.02,.15,0,.008);t+=b*beat});
  for(let b=0;b<32;b++){const s0=Math.floor(b*beat*sr);let ph=0;
    for(let i=0;i<.4*sr&&s0+i<n;i++){const u=i/sr;ph+=TAU*(45+75*Math.exp(-u*30))/sr;o[s0+i]+=.5*Math.sin(ph)*Math.exp(-u*8)}
    const h0=Math.floor((b+.5)*beat*sr);let prev=0;
    for(let i=0;i<.08*sr&&h0+i<n;i++){const z=Math.random()*2-1;o[h0+i]+=.06*(z-prev)*Math.exp(-i/sr*60);prev=z}}
  let pk=0;for(let i=0;i<n;i++)pk=Math.max(pk,Math.abs(o[i]));
  for(let i=0;i<n;i++)o[i]*=.7/pk;
  return o;
}
async function loadDemo(first){
  status('Building demo clip…');await tick();
  const o=makeDemo(44100);
  await useAudio(o,o,44100,'Demo clip: synthesised bass, pads, lead and drums');
  if(first&&!bands.length){addBand(62,3,true);addBand(262,0,true);const b=addBand(560,0,true);select(bands[0]);off0=1.5;$('seek').value=1.5;$('time').textContent=fmt(1.5)+' / '+fmt(dur());void b}
}
$('demo').onclick=()=>loadDemo(false);
$('file').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;ensureCtx();status('Decoding…');
  try{
    const buf=await ac.decodeAudioData(await f.arrayBuffer()),n=Math.min(buf.length,Math.floor(MAX_SEC*buf.sampleRate));
    const L=buf.getChannelData(0).slice(0,n),R=(buf.numberOfChannels>1?buf.getChannelData(1):buf.getChannelData(0)).slice(0,n);
    await useAudio(L,R,buf.sampleRate,f.name,buf.length>n);
  }catch(err){status('Could not decode that file. Try MP3, WAV or M4A.')}
  e.target.value='';
});

window.pfx={get bands(){return bands},S,sat};
size();requestAnimationFrame(loop);loadDemo(true);
})();
